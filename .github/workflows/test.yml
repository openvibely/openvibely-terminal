name: Test

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      uncached:
        description: Run tests without the Go test cache
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      uncached:
        description: Run tests without the Go test cache
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Main test suite (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York

    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet and all tests with coverage
        shell: bash
        env:
          VTC_MODE: ${{ inputs.uncached && 'uncached' || 'routine' }}
          VTC_GITHUB_ANNOTATIONS: "true"
        run: .github/workflows/vet-test-coverage.sh

      - name: Show coverage summary
        if: ${{ success() }}
        run: go tool cover -func=coverage.txt | tail -1
