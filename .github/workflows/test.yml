name: Test

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      uncached:
        description: Run tests without the Go test cache
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      uncached:
        description: Run tests without the Go test cache
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Main test suite (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York

    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet and all tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          vet_status=0
          test_status=0

          # Keep vet's build fan-out bounded while it overlaps with the full test build.
          GOMAXPROCS=1 go vet ./... &
          vet_pid=$!

          if [[ "${{ inputs.uncached }}" == "true" ]]; then
            go test ./... -count=1 -timeout 120s -coverpkg=./... -coverprofile=coverage.txt || test_status=$?
          else
            go test ./... -timeout 120s -coverpkg=./... -coverprofile=coverage.txt || test_status=$?
          fi

          # Always reap vet so a test failure cannot hide a vet failure or leave it running.
          wait "$vet_pid" || vet_status=$?

          if (( vet_status != 0 )); then
            echo "::error::go vet ./... failed with exit code ${vet_status}"
          fi
          if (( test_status != 0 )); then
            echo "::error::go test ./... failed with exit code ${test_status}"
          fi
          if (( vet_status != 0 || test_status != 0 )); then
            exit 1
          fi

          if [[ ! -s coverage.txt ]]; then
            echo "::error::go test did not produce a non-empty coverage profile"
            exit 1
          fi

      - name: Show coverage summary
        if: ${{ success() }}
        run: go tool cover -func=coverage.txt | tail -1
