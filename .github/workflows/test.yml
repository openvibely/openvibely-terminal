name: Test

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      uncached:
        description: Run tests without the Go test cache
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      uncached:
        description: Run tests without the Go test cache
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Main test suite (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York

    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet and all tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          vet_status=0
          test_status=0
          vet_pid=
          test_pid=

          stop_child() {
            local pid=$1
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
          }

          cleanup_children() {
            if [[ -n "${test_pid:-}" ]]; then
              stop_child "$test_pid"
              test_pid=
            fi
            if [[ -n "${vet_pid:-}" ]]; then
              stop_child "$vet_pid"
              vet_pid=
            fi
          }

          on_exit() {
            local status=$?
            trap - EXIT INT TERM
            cleanup_children
            exit "$status"
          }

          on_signal() {
            local status=$1
            trap - EXIT INT TERM
            cleanup_children
            exit "$status"
          }

          trap on_exit EXIT
          trap 'on_signal 130' INT
          trap 'on_signal 143' TERM

          # Keep vet's build fan-out bounded while it overlaps with the full test build.
          GOMAXPROCS=1 go vet ./... &
          vet_pid=$!

          if [[ "${{ inputs.uncached }}" == "true" ]]; then
            go test ./... -count=1 -timeout 120s -coverpkg=./... -coverprofile=coverage.txt &
          else
            go test ./... -timeout 120s -coverpkg=./... -coverprofile=coverage.txt &
          fi
          test_pid=$!

          # Always reap both children so a failure, cancellation, or timeout cannot
          # hide a status or leave vet/test running.
          wait "$test_pid" || test_status=$?
          test_pid=
          wait "$vet_pid" || vet_status=$?
          vet_pid=

          if (( vet_status != 0 )); then
            echo "::error::go vet ./... failed with exit code ${vet_status}"
          fi
          if (( test_status != 0 )); then
            echo "::error::go test ./... failed with exit code ${test_status}"
          fi
          if (( vet_status != 0 || test_status != 0 )); then
            exit 1
          fi

          if [[ ! -s coverage.txt ]]; then
            echo "::error::go test did not produce a non-empty coverage profile"
            exit 1
          fi

      - name: Show coverage summary
        if: ${{ success() }}
        run: go tool cover -func=coverage.txt | tail -1
